<!DOCTYPE html>
<!-- hand-made fixture: throws-broken -- Broken twin of throws: a typo in reset() (Math.sinn) throws on load. Two blocks sliding down identical ramps with friction, different masses. Not model output. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#f8fafc}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W=0,H=0;
function resize(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
const g=9.81,L=4;let p,blocks,t;
function block(mass,color,name){return{mass,color,name,s:0,v:0,done:null};}
window.SIM={
  title:'Blocks on a Rough Ramp',
  params:[
    {id:'angle',label:'Ramp angle (°)',min:10,max:60,step:1,value:30},
    {id:'friction',label:'Friction coefficient',min:0,max:0.5,step:0.01,value:0.2},
    {id:'massB',label:'Block B mass (kg)',min:1,max:20,step:1,value:8}],
  question:'Block B is eight times heavier than block A (1 kg). Which reaches the bottom of the ramp first?',
  reset(v){p=v;t=0;const tilt=Math.sinn(p.angle);blocks=[block(1,'#2563eb','A'),block(p.massB,'#dc2626','B')];}
};
function step(b,h){if(b.done!==null)return;const th=p.angle*Math.PI/180;
  const a=Math.max(0,g*Math.sin(th)-p.friction*g*Math.cos(th));b.v+=a*h;b.s+=b.v*h;
  if(b.s>=L){b.s=L;b.done=t;}}
function draw(){ctx.clearRect(0,0,W,H);const th=p.angle*Math.PI/180;
  blocks.forEach((b,i)=>{const cx=W*(i?0.53:0.05),w=W*0.42,sc=Math.min(w/Math.cos(th),H*0.6/Math.sin(th))/L;
    const x0=cx,y0=H*0.15,x1=x0+L*sc*Math.cos(th),y1=y0+L*sc*Math.sin(th);
    ctx.strokeStyle='#0f172a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.lineTo(x0,y1);ctx.stroke();
    const bx=x0+b.s*sc*Math.cos(th),by=y0+b.s*sc*Math.sin(th),sz=18+4*Math.cbrt(b.mass);
    ctx.save();ctx.translate(bx,by);ctx.rotate(th);ctx.fillStyle=b.color;ctx.fillRect(-sz/2,-sz,sz,sz);ctx.restore();
    ctx.fillStyle='#0f172a';ctx.textAlign='center';ctx.font='bold 26px system-ui';ctx.fillText(b.name+': '+b.mass+' kg',(x0+x1)/2,H-80);
    ctx.font='22px system-ui';ctx.fillText(b.done!==null?'Bottom at '+b.done.toFixed(2)+' s':'Speed '+b.v.toFixed(2)+' m/s',(x0+x1)/2,H-44);});}
let last=performance.now();
function frame(now){const dt=Math.min((now-last)/1000,1/30);last=now;const n=8,h=dt/n;
  for(let i=0;i<n;i++){if(blocks.some(b=>b.done===null))t+=h;blocks.forEach(b=>step(b,h));}draw();requestAnimationFrame(frame);}
SIM.reset(Object.fromEntries(SIM.params.map(q=>[q.id,q.value])));requestAnimationFrame(frame);
</script></body></html>
