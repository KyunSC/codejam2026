<!DOCTYPE html>
<!-- hand-made fixture: bad-params -- Defines SIM but its param has min > max. Not model output. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#f8fafc}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W=0,H=0,p;
function resize(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
window.SIM={
  title:'Heating a Pot of Water',
  params:[{id:'power',label:'Burner power (W)',min:2000,max:500,step:100,value:1000}],
  question:'If we double the burner power, does the water boil in half the time?',
  reset(v){p=v;}
};
function frame(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#0f172a';ctx.font='28px system-ui';ctx.fillText('Power: '+p.power+' W',40,60);requestAnimationFrame(frame);}
SIM.reset({power:1000});requestAnimationFrame(frame);
</script></body></html>
