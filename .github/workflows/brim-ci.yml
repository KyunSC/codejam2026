name: Brim PR checks
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: brim-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Brim tests, types, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Brim
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: brim
          POSTGRES_PASSWORD: brim_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:brim_ci@127.0.0.1:5432/brim
      BRIM_LOCAL_DB_ONLY: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: Brim/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx --no-install prisma migrate deploy
      - run: npm run db:seed
      - run: npm test
