name: Brim PR checks
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: brim-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Brim tests, types, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Brim
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: Brim/package-lock.json
      - run: node --test ../.github/scripts/brim-preview.test.cjs
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
