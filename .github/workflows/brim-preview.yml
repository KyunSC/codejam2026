name: Brim preview health
on:
  repository_dispatch:
    types: [vercel.deployment.success, vercel.deployment.error, vercel.deployment.failed, vercel.deployment.canceled, vercel.deployment.ignored, vercel.deployment.skipped]
  status:

permissions: {}

jobs:
  health:
    if: >-
      github.event.sender.login == 'vercel[bot]' &&
      ((github.event_name == 'status' && github.event.context == 'Vercel – brimcodejam2026') ||
       (github.event.client_payload.project.id == 'prj_bqseYxx2xPoNqV67i3AgF5w7VQ6L' &&
        github.event.client_payload.environment == 'preview'))
    concurrency:
      group: brim-preview-${{ github.event.client_payload.git.sha || github.event.sha }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      id-token: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/brim-preview.cjs')({ github, context, core })
