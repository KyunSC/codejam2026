name: Brim preview health
on:
  repository_dispatch:
    types: [vercel.deployment.success, vercel.deployment.error, vercel.deployment.failed, vercel.deployment.canceled, vercel.deployment.ignored, vercel.deployment.skipped]

permissions: {}

jobs:
  health:
    if: >-
      github.event.sender.login == 'vercel[bot]' &&
      github.event.client_payload.project.id == 'prj_bqseYxx2xPoNqV67i3AgF5w7VQ6L' &&
      github.event.client_payload.environment == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      id-token: write
      statuses: write
    steps:
      # Dispatch runs on main. Report the result on the commit Vercel actually built.
      - uses: actions/github-script@v8
        with:
          script: |
            const { git, url } = context.payload.client_payload
            const status = (state, description) => github.rest.repos.createCommitStatus({
              ...context.repo, sha: git.sha, context: 'Brim preview / Neon',
              state, description,
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            })
            await status('pending', 'Checking the Brim deployment')
            try {
              if (context.payload.action !== 'vercel.deployment.success') {
                throw new Error(`Vercel reported ${context.payload.action}`)
              }
              const preview = new URL(url)
              if (preview.origin !== `https://${preview.hostname}` ||
                  !/^brimcodejam2026-[a-z0-9-]+-sunnys-projects-538942c4\.vercel\.app$/.test(preview.hostname)) {
                throw new Error('Unexpected preview URL')
              }
              const token = await core.getIDToken('brim-preview-health')
              core.setSecret(token)
              const response = await fetch(new URL('/api/health', preview), {
                headers: { 'x-vercel-trusted-oidc-idp-token': token },
                redirect: 'manual', signal: AbortSignal.timeout(45000)
              })
              if (response.status !== 200) throw new Error(`Health endpoint returned HTTP ${response.status}`)
              const result = await response.json()
              if (result.ok !== true || result.database !== 'up') throw new Error('Unexpected health response')
              await status('success', 'The deployed app can read the invoice schema')
            } catch (err) {
              await status('failure', 'Preview deployment or database health check failed')
              throw err
            }
